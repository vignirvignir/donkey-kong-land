<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gorilla Land — a Game Boy style platformer</title>
<style>
  html, body {
    margin: 0; padding: 0; height: 100%;
    background: #0f380f;
    display: flex; align-items: center; justify-content: center;
    overflow: hidden;
  }
  canvas {
    image-rendering: pixelated;
    image-rendering: crisp-edges;
    border: 4px solid #306230;
    border-radius: 4px;
  }
  #help {
    position: fixed; bottom: 6px; left: 0; right: 0;
    text-align: center; color: #8bac0f;
    font: 11px monospace; letter-spacing: 1px;
    user-select: none;
  }
</style>
</head>
<body>
<canvas id="screen" width="160" height="144"></canvas>
<div id="help">ARROWS move &nbsp; X/K jump &nbsp; Z/J roll+grab &nbsp; ENTER start &nbsp; SHIFT select/switch</div>
<script type="module" src="src/main.js"></script>
</body>
</html>
